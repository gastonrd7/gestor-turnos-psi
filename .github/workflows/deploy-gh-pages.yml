name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # o la rama que uses
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint & Test
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Build & Export
        run: |
          npm run build
          npm run export
          # Evita que GitHub Pages procese Jekyll
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
